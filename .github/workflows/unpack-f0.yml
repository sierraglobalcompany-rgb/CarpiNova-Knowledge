name: Unpack F0 snapshot

on:
  push:
    branches:
      - feat/knowledge-f0
    paths:
      - .github/workflows/unpack-f0.yml
      - bootstrap/**

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/knowledge-f0
          fetch-depth: 0

      - name: Restore verified F0 snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/f0-part-*.b64 > /tmp/f0.b64
          base64 -d /tmp/f0.b64 > /tmp/f0.tar.xz
          echo "ac0f8ee562de9d95b63602e22e4b2907d1de84e3ececb5b1affb67526efd3062  /tmp/f0.tar.xz" | sha256sum -c -
          tar -xJf /tmp/f0.tar.xz -C .

          test -f src/carpinova_knowledge/validate_repo.py
          test -f tests/test_report_pilot.py
          test -f audits/f0-pilot-acceptance.md
          test -f dist/pilot/knowledge.bundle.json

          rm -rf bootstrap .sync
          rm -f .github/workflows/unpack-f0.yml .github/workflows/sync-f0.yml README.tmp

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit"
            exit 0
          fi
          git commit -m "chore: synchronize complete CarpiNova Knowledge F0 [skip ci]"
          git push origin HEAD:feat/knowledge-f0
