name: Synchronize approved F0 docs

on:
  push:
    branches:
      - feat/knowledge-f0
    paths:
      - .github/workflows/sync-approved-docs.yml

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/knowledge-f0
          fetch-depth: 0

      - name: Copy approved spec and plan from CarpiNova-PC
        shell: bash
        run: |
          set -euo pipefail
          SPEC=docs/superpowers/specs/2026-10-09-carpinova-knowledge-f0-f1-design.md
          PLAN=docs/superpowers/plans/2026-10-09-carpinova-knowledge-f0-implementation.md
          mkdir -p "$(dirname "$SPEC")" "$(dirname "$PLAN")"
          curl -fsSL "https://raw.githubusercontent.com/sierraglobalcompany-rgb/CarpiNova-PC/main/$SPEC" -o "$SPEC"
          curl -fsSL "https://raw.githubusercontent.com/sierraglobalcompany-rgb/CarpiNova-PC/main/$PLAN" -o "$PLAN"
          grep -q "## 1. Propósito" "$SPEC"
          grep -q "### Task 10: Acceptance audit and F0 freeze" "$PLAN"
          test "$(wc -l < "$SPEC")" -gt 200
          test "$(wc -l < "$PLAN")" -gt 200

      - name: Commit approved documents
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/sync-approved-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: synchronize approved CarpiNova Knowledge spec and plan"
          git push origin HEAD:feat/knowledge-f0
