name: Controller sync final F0 branch

on:
  push:
    branches:
      - feat/knowledge-f0
    paths:
      - .github/workflows/controller-sync-final.yml

permissions:
  contents: write

jobs:
  sync-final:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout final branch
        uses: actions/checkout@v4
        with:
          ref: feat/knowledge-f0-final
          fetch-depth: 0

      - name: Reassemble and verify exact local F0 archive
        shell: bash
        run: |
          set -euo pipefail
          cat .sync/parts/*.b64 > /tmp/f0.b64
          base64 -d /tmp/f0.b64 > /tmp/f0.tar.gz
          echo "addecc1c4f253af8d83abac55f4e305403998f94d67a47fbaf230824b7f30b00  /tmp/f0.tar.gz" | sha256sum -c -
          mkdir -p /tmp/carpinova-f0
          tar -xzf /tmp/f0.tar.gz -C /tmp/carpinova-f0
          test -f /tmp/carpinova-f0/pyproject.toml
          test -f /tmp/carpinova-f0/src/carpinova_knowledge/cli.py
          test -f /tmp/carpinova-f0/audits/f0-pilot-acceptance.md
          rm -rf /tmp/carpinova-f0/.github/workflows

      - name: Replace final branch tree, excluding workflows
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/carpinova-f0/. .
          git status --short

      - name: Commit exact F0 content to final branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: synchronize verified CarpiNova Knowledge F0 content"
          git push origin HEAD:feat/knowledge-f0-final
