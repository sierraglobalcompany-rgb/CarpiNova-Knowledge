name: Knowledge QA

on:
  push:
    branches:
      - main
      - 'feat/knowledge-f1*'
      - 'knowledge/f1-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Diagnose F0 pilot
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          from carpinova_knowledge.report_pilot import build_pilot_report
          print(json.dumps(build_pilot_report(Path('.'), 'batch-000-pilot'), ensure_ascii=False, indent=2))
          PY
          exit 1
