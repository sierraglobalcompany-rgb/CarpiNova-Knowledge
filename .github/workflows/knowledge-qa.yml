name: Knowledge QA

on:
  push:
    branches:
      - main
      - 'feat/knowledge-f1*'
      - 'knowledge/f1-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print source audit pages 120-121
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path('books/cpnc-2025/audits/raw-page-audit.json').read_text(encoding='utf-8'))
          page_map = json.loads(Path('books/cpnc-2025/page-map.json').read_text(encoding='utf-8'))
          wanted = {120, 121}
          print('=== RAW PAGE AUDIT ===')
          for page in audit['pages']:
              if page.get('pdf_page') in wanted:
                  print(json.dumps(page, ensure_ascii=False, indent=2))
          print('=== PAGE MAP ===')
          for page in page_map['pages']:
              if page.get('pdf_page') in wanted:
                  print(json.dumps(page, ensure_ascii=False, indent=2))
          PY
