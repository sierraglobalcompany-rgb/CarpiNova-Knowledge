name: Fix Ruff F0

on:
  push:
    branches:
      - feat/knowledge-f0
    paths:
      - .github/workflows/fix-ruff-f0.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/knowledge-f0
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Apply the two non-autofix lint corrections
        shell: python
        run: |
          from pathlib import Path

          render = Path("src/carpinova_knowledge/render_docs.py")
          text = render.read_text(encoding="utf-8")
          old = 'raise ValueError("content.json must contain a list of ContentSpec records")'
          new = 'raise TypeError("content.json must contain a list of ContentSpec records")'
          if old not in text:
              raise SystemExit("render_docs lint target not found")
          render.write_text(text.replace(old, new, 1), encoding="utf-8")

          validator = Path("src/carpinova_knowledge/validate_repo.py")
          text = validator.read_text(encoding="utf-8")
          old = "except Exception as exc:"
          new = "except (KeyError, TypeError, ValueError) as exc:"
          if old not in text:
              raise SystemExit("validate_repo lint target not found")
          validator.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Apply Ruff safe fixes
        run: uv run ruff check . --fix

      - name: Verify Ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -q

      - name: Validate repository
        run: uv run python -m carpinova_knowledge validate --root .

      - name: Verify F0 pilot acceptance
        run: uv run python -m carpinova_knowledge report-pilot --root . --batch batch-000-pilot

      - name: Commit verified lint cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-ruff-f0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: satisfy Ruff quality gate"
          git push origin HEAD:feat/knowledge-f0
