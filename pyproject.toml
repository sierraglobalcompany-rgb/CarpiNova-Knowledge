[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carpinova-knowledge"
version = "0.0.0"
description = "Canonical structured knowledge base for CarpiNova"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PyMuPDF>=1.26,<2",
  "jsonschema>=4.25,<5",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/carpinova_knowledge"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
