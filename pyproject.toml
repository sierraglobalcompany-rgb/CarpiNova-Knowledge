[project]
name = "carpinova-knowledge"
version = "0.1.0"
description = "Canonical structured knowledge base and validation toolchain for CarpiNova"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PyMuPDF>=1.26,<2",
  "jsonschema>=4.25,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
